<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game</title>
  <link rel="stylesheet" href="/ejs/emulator.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000 !important;
      overflow: hidden;
    }
    #game {
      width: 100%; height: 100%;
      background: #000 !important;
    }

    /* ── NUCLEAR: Hide every EJS UI element except the canvas ── */
    /* Loading text, start button, toolbar, menus */
    .ejs_menu_bar,
    .ejs_start_button,
    .ejs_start_button_border,
    .ejs_context_menu,
    .ejs_popup_container,
    .ejs_popup_container_box,
    .ejs_loading_text,
    .ejs_loading_text_glow,
    .ejs_netplay,
    .ejs_ad_container,
    .ejs_ad_close,
    .ejs_ad_iframe {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* ── CRITICAL: Hide EJS virtual gamepad (the white overlay on mobile) ── */
    /* Class name confirmed from EJS source: ejs_virtualGamepad_parent */
    .ejs_virtual,
    .ejs_virtualGamepad_parent,
    [class*="ejs_virtual"],
    [class*="ejs_dpad"],
    [class*="ejs_button_button"],
    .ejs_dpad_main,
    .ejs_dpad_bar,
    .ejs_dpad_horizontal,
    .ejs_dpad_vertical,
    #ejs_virtualGamepad_parent {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Force black background on all EJS containers */
    .ejs_parent,
    .ejs_game,
    .ejs_game_background,
    .ejs_canvas_parent {
      background: #000 !important;
    }

    /* Canvas fills the container */
    .ejs_canvas,
    #game canvas {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>

  <!-- Set ALL globals BEFORE loader.js runs -->
  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'gb';
    window.EJS_gameUrl = 'https://d2xsxph8kpxj0f.cloudfront.net/92674841/7HRuzqv5FoVkY7UCaEELrN/SuperMarioBrosMini_9a61d5e5.gb';
    window.EJS_pathtodata = '/ejs/';
    window.EJS_color = '#8C0CE0';
    window.EJS_startOnLoaded = true;
    window.EJS_disableLocalStorage = true;
    window.EJS_gameName = 'Super Mario Bros Mini';
    window.EJS_disableAutoLang = false;
    window.EJS_paths = {
      'en-US': '/ejs/localization/en-US.json',
    };
    window.EJS_loadStateOnStart = null;
    window.EJS_saveStateOnExit = null;
    window.EJS_cheats = [];
    window.EJS_volume = 0.5;

    // Intercept touch detection: prevent EJS from knowing it's a touch device
    // This stops EJS from showing the virtual gamepad
    window.EJS_onGameStart = function() {
      try {
        var emu = window.EJS_emulator;
        if (emu) {
          // Force touch=false so virtual gamepad never shows
          emu.touch = false;
          // If toggleVirtualGamepad exists, hide it
          if (typeof emu.toggleVirtualGamepad === 'function') {
            emu.toggleVirtualGamepad(false);
          }
          // Also hide the virtualGamepad element directly
          if (emu.virtualGamepad) {
            emu.virtualGamepad.style.display = 'none';
            emu.virtualGamepad.style.visibility = 'hidden';
          }
        }
      } catch(e) {
        console.warn('Could not suppress virtual gamepad:', e);
      }
    };
  </script>
</head>
<body>
  <div id="game"></div>
  <script src="/ejs/loader.js"></script>
  <script>
    // ── GB button IDs for simulateInput(player, buttonId, value) ──
    // 0=B, 2=SELECT, 3=START, 4=UP, 5=DOWN, 6=LEFT, 7=RIGHT, 8=A
    var BTN_IDS = {
      B:      0,
      SELECT: 2,
      START:  3,
      UP:     4,
      DOWN:   5,
      LEFT:   6,
      RIGHT:  7,
      A:      8,
    };

    function pressButton(btn, pressed) {
      var id = BTN_IDS[btn];
      if (id === undefined) return;
      var emu = window.EJS_emulator;
      if (!emu || !emu.gameManager) return;
      var value = pressed ? 1 : 0;
      try {
        emu.gameManager.simulateInput(0, id, value);
      } catch(e) {
        console.warn('simulateInput failed:', e);
      }
    }

    // Listen for messages from parent frame
    window.addEventListener('message', function(e) {
      if (!e.data) return;

      if (e.data.type === 'gamekey') {
        pressButton(e.data.btn, e.data.eventType === 'keydown');
        return;
      }

      if (e.data.type === 'restart') {
        try {
          var emu = window.EJS_emulator;
          if (emu && emu.gameManager && typeof emu.gameManager.restart === 'function') {
            emu.gameManager.restart();
          }
        } catch(err) {
          console.warn('Restart failed:', err);
        }
        return;
      }

      if (e.data.type === 'pause') {
        try {
          var emu = window.EJS_emulator;
          if (emu && typeof emu.togglePause === 'function') emu.togglePause();
        } catch(err) {}
        return;
      }
    });

    // Poll until game is ready, then notify parent and suppress virtual gamepad
    function checkReady() {
      var emu = window.EJS_emulator;

      // Always hide EJS UI elements while polling
      document.querySelectorAll(
        '.ejs_loading_text, .ejs_start_button, .ejs_menu_bar, ' +
        '.ejs_virtualGamepad_parent, .ejs_virtual, .ejs_dpad_main'
      ).forEach(function(el) {
        el.style.display = 'none';
        el.style.visibility = 'hidden';
      });

      if (emu && emu.started) {
        // Suppress virtual gamepad
        try {
          emu.touch = false;
          if (typeof emu.toggleVirtualGamepad === 'function') {
            emu.toggleVirtualGamepad(false);
          }
          if (emu.virtualGamepad) {
            emu.virtualGamepad.style.display = 'none';
            emu.virtualGamepad.style.visibility = 'hidden';
            emu.virtualGamepad.style.pointerEvents = 'none';
          }
        } catch(e) {}

        window.parent.postMessage({ type: 'gameReady' }, '*');
        return;
      }
      setTimeout(checkReady, 300);
    }
    setTimeout(checkReady, 800);

    // MutationObserver to hide elements as they're added to the DOM
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeType !== 1) return;
          var classesToHide = [
            'ejs_loading_text', 'ejs_start_button', 'ejs_menu_bar',
            'ejs_context_menu', 'ejs_popup_container',
            'ejs_virtualGamepad_parent', 'ejs_virtual',
            'ejs_dpad_main', 'ejs_ad_container'
          ];
          classesToHide.forEach(function(cls) {
            if (node.classList && node.classList.contains(cls)) {
              node.style.display = 'none';
              node.style.visibility = 'hidden';
              node.style.pointerEvents = 'none';
            }
            if (node.querySelectorAll) {
              node.querySelectorAll('.' + cls).forEach(function(el) {
                el.style.display = 'none';
                el.style.visibility = 'hidden';
                el.style.pointerEvents = 'none';
              });
            }
          });
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
