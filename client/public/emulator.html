<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000 !important;
      overflow: hidden;
    }
    #game {
      width: 100%; height: 100%;
      background: #000 !important;
    }
  </style>

  <script>
    // ══════════════════════════════════════════════════════════════════
    // STEP 1: Intercept document.createElement to catch the virtualGamepad
    // div before EJS appends it, and freeze its style.display to "none"
    // ══════════════════════════════════════════════════════════════════
    var _origCreateElement = document.createElement.bind(document);
    var _virtualGamepadIntercepted = false;
    document.createElement = function(tag) {
      var el = _origCreateElement(tag);
      if (tag === 'div' && !_virtualGamepadIntercepted) {
        // We'll identify the virtualGamepad div when EJS adds the class
        var _origClassListAdd = el.classList.add.bind(el.classList);
        el.classList.add = function() {
          _origClassListAdd.apply(this, arguments);
          // When EJS adds ejs_virtualGamepad_parent class, freeze display
          for (var i = 0; i < arguments.length; i++) {
            if (arguments[i] === 'ejs_virtualGamepad_parent') {
              _virtualGamepadIntercepted = true;
              // Restore original createElement
              document.createElement = _origCreateElement;
              // Force display to none and block any future assignment
              el.style.setProperty('display', 'none', 'important');
              el.style.setProperty('visibility', 'hidden', 'important');
              el.style.setProperty('pointer-events', 'none', 'important');
              // Override the style.display setter to be a no-op
              try {
                var _origDisplay = Object.getOwnPropertyDescriptor(
                  CSSStyleDeclaration.prototype, 'display'
                ) || { get: function() { return el.style.getPropertyValue('display'); } };
                Object.defineProperty(el.style, 'display', {
                  get: function() { return 'none'; },
                  set: function(v) {
                    // Always keep it none - ignore EJS trying to show it
                    el.style.setProperty('display', 'none', 'important');
                  },
                  configurable: true
                });
              } catch(e) {
                console.warn('Could not override display property:', e);
              }
            }
          }
        };
      }
      return el;
    };

    // ══════════════════════════════════════════════════════════════════
    // STEP 2: EJS config — set backgroundColor to black
    // ══════════════════════════════════════════════════════════════════
    window.EJS_player = '#game';
    window.EJS_core = 'gb';
    window.EJS_gameUrl = 'https://d2xsxph8kpxj0f.cloudfront.net/92674841/7HRuzqv5FoVkY7UCaEELrN/SuperMarioBrosMini_9a61d5e5.gb';
    window.EJS_pathtodata = '/ejs/';
    window.EJS_color = '#8C0CE0';
    window.EJS_startOnLoaded = true;
    window.EJS_disableLocalStorage = true;
    window.EJS_gameName = 'Super Mario Bros Mini';
    window.EJS_disableAutoLang = true;
    window.EJS_cheats = [];
    window.EJS_volume = 0.5;
    window.EJS_backgroundColor = 'rgb(0, 0, 0)';  // Black background

    window.EJS_onGameStart = function() {
      try {
        var emu = window.EJS_emulator;
        if (!emu) return;
        // Belt-and-suspenders: force touch=false
        emu.touch = false;
        // Hide virtualGamepad if it somehow got shown
        if (emu.virtualGamepad) {
          emu.virtualGamepad.style.setProperty('display', 'none', 'important');
          emu.virtualGamepad.style.setProperty('visibility', 'hidden', 'important');
        }
        // Notify parent that game started
        window.parent.postMessage({ type: 'gameReady' }, '*');
      } catch(e) {}
    };
  </script>
</head>
<body>
  <div id="game"></div>
  <link rel="stylesheet" href="/ejs/emulator.min.css" />
  <style>
    /* Force black on all EJS containers — belt-and-suspenders */
    .ejs_parent, .ejs_game, .ejs_canvas_parent, .ejs_game_background {
      background: #000 !important;
    }
    /* Hide all EJS UI chrome */
    .ejs_menu_bar, .ejs_start_button, .ejs_start_button_border,
    .ejs_context_menu, .ejs_popup_container, .ejs_loading_text,
    .ejs_loading_text_glow, .ejs_netplay, .ejs_ad_container,
    .ejs_ad_close, .ejs_ad_iframe {
      display: none !important;
      visibility: hidden !important;
    }
    /* Hide virtual gamepad */
    .ejs_virtualGamepad_parent,
    [class*="ejs_virtualGamepad"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    /* Canvas fills container */
    .ejs_canvas, #game canvas {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
  <script src="/ejs/loader.js"></script>
  <script>
    // ── GB button IDs for simulateInput(player, buttonId, value) ──
    // 0=B, 2=SELECT, 3=START, 4=UP, 5=DOWN, 6=LEFT, 7=RIGHT, 8=A
    var BTN_IDS = { B:0, SELECT:2, START:3, UP:4, DOWN:5, LEFT:6, RIGHT:7, A:8 };

    function pressButton(btn, pressed) {
      var id = BTN_IDS[btn];
      if (id === undefined) return;
      var emu = window.EJS_emulator;
      if (!emu || !emu.gameManager) return;
      try { emu.gameManager.simulateInput(0, id, pressed ? 1 : 0); } catch(e) {}
    }

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'gamekey') {
        pressButton(e.data.btn, e.data.eventType === 'keydown');
      } else if (e.data.type === 'restart') {
        try {
          var emu = window.EJS_emulator;
          if (emu && emu.gameManager) emu.gameManager.restart();
        } catch(err) {}
      }
    });

    // Fallback: poll and notify parent when game is ready
    function checkReady() {
      var emu = window.EJS_emulator;
      if (emu && emu.started) {
        window.parent.postMessage({ type: 'gameReady' }, '*');
        return;
      }
      setTimeout(checkReady, 300);
    }
    setTimeout(checkReady, 1000);
  </script>
</body>
</html>
