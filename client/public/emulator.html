<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Box Emulator</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
      background: #000;
    }
    .ejs_menu_bar,
    .ejs_context_menu,
    .ejs_popup_container,
    .ejs_ad_iframe,
    .ejs_ad_close,
    .ejs_virtualGamepad_parent,
    [class*="ejs_virtualGamepad"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .ejs_parent,
    .ejs_game,
    .ejs_canvas_parent,
    .ejs_game_background {
      background: #000 !important;
    }
    .ejs_canvas,
    #game canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'gb';
    window.EJS_gameUrl = 'https://d2xsxph8kpxj0f.cloudfront.net/92674841/7HRuzqv5FoVkY7UCaEELrN/SuperMarioBrosMini_c0a39acf.gb';
    window.EJS_pathtodata = '/ejs/';
    window.EJS_startOnLoaded = true;
    window.EJS_disableLocalStorage = true;
    window.EJS_disableDatabases = true;
    window.EJS_disableAutoLang = true;
    window.EJS_gameName = 'Super Mario Bros Mini';
    window.EJS_color = '#8bac0f';
    window.EJS_backgroundColor = 'rgb(0, 0, 0)';
    // Start muted to avoid audio context suspension crash on mobile Safari.
    // Audio is enabled after the first user interaction.
    window.EJS_volume = 0;
    window.EJS_cacheBust = '20260317-v3';
    window.EJS_onGameStart = function() {
      try {
        window.parent.postMessage({ type: 'gameReady' }, '*');
      } catch (e) {}
    };
  </script>
</head>
<body>
  <div id="game"></div>
  <script src="/ejs/loader.js?v=20260317-v3"></script>
  <script>
    var BTN_IDS = { B:0, SELECT:2, START:3, UP:4, DOWN:5, LEFT:6, RIGHT:7, A:8 };
    var interactionSent = false;
    var audioUnlocked = false;

    function notifyInteraction() {
      if (interactionSent) return;
      interactionSent = true;
      try {
        window.parent.postMessage({ type: 'userInteraction' }, '*');
      } catch (e) {}
    }

    function tryUnlockAudio() {
      if (audioUnlocked) return;
      try {
        var emu = window.EJS_emulator;
        if (!emu || !emu.Module || !emu.Module.AL) return;
        var alCtx = emu.Module.AL.currentCtx;
        if (!alCtx || !alCtx.audioCtx) return;
        var ctx = alCtx.audioCtx;
        if (ctx.state === 'suspended') {
          var p = ctx.resume();
          if (p && typeof p.then === 'function') {
            p.then(function() {
              audioUnlocked = true;
              // Unmute at 50% volume after audio context resumes
              try {
                if (emu.setVolume) emu.setVolume(0.5);
              } catch(e2) {}
            }).catch(function() {});
          } else {
            audioUnlocked = true;
          }
        } else if (ctx.state === 'running') {
          audioUnlocked = true;
          try {
            if (emu.setVolume) emu.setVolume(0.5);
          } catch(e2) {}
        }
      } catch (e) {}
    }

    function pressButton(btn, pressed) {
      var id = BTN_IDS[btn];
      if (id === undefined) return;
      var emu = window.EJS_emulator;
      if (!emu || !emu.gameManager) return;
      try {
        emu.gameManager.simulateInput(0, id, pressed ? 1 : 0);
      } catch (e) {}
    }

    function handleRealInteraction() {
      notifyInteraction();
      tryUnlockAudio();
    }

    window.addEventListener('pointerdown', handleRealInteraction, { passive: true });
    window.addEventListener('touchstart', handleRealInteraction, { passive: true });
    window.addEventListener('keydown', handleRealInteraction);

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'gamekey') {
        pressButton(e.data.btn, e.data.eventType === 'keydown');
        return;
      }
      if (e.data.type === 'restart') {
        try {
          var emu = window.EJS_emulator;
          if (emu && emu.gameManager) emu.gameManager.restart();
        } catch (err) {}
      }
    });

    function checkReady() {
      var emu = window.EJS_emulator;
      if (emu && emu.started) {
        try {
          window.parent.postMessage({ type: 'gameReady' }, '*');
        } catch (e) {}
        return;
      }
      setTimeout(checkReady, 300);
    }
    setTimeout(checkReady, 1000);
  </script>
</body>
</html>
